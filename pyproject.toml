[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latticehf"
version = "0.1.0"
description = "Hartree-Fock solver for lattice models with intersite interactions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "black"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]